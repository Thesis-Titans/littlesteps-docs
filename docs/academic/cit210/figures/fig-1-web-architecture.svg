<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <marker id="arrow-wf" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#1F634D"/>
    </marker>
    <marker id="arrow-wb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2B6CB0"/>
    </marker>
    <marker id="arrow-wp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7C4D8B"/>
    </marker>
    <marker id="arrow-wt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#C25525"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#FFFFFF"/>
  <rect x="6" y="6" width="1188" height="508" rx="14" fill="#FFFFFF" stroke="#D4DCD8" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="44" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="700" fill="#1F634D">LittleSteps Web System Architecture</text>
  <text x="40" y="68" font-family="Arial, Liberation Sans, sans-serif" font-size="14" fill="#5A6A64">Connecting the React web client with the Express backend API, Firestore database, and external services</text>
  <line x1="40" y1="84" x2="1160" y2="84" stroke="#E0E5DB" stroke-width="1.2"/>

  <!-- Column 1: Caregiver -->
  <rect x="40" y="108" width="210" height="252" rx="10" fill="#FAFBF9" stroke="#C5CEC9" stroke-width="2"/>
  <path d="M 50 108 H 240 Q 250 108 250 118 V 150 H 40 V 118 Q 40 108 50 108 Z" fill="#F4F2E8"/>
  <text x="145" y="135" font-family="Arial, Liberation Sans, sans-serif" font-size="15.5" font-weight="700" fill="#1A2B29" text-anchor="middle">Caregiver Actions</text>
  <text x="58" y="184" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Child age band</text>
  <text x="58" y="220" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Time &amp; items at home</text>
  <text x="58" y="256" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Storybook search</text>
  <text x="58" y="292" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Private reflections</text>
  <text x="58" y="334" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" fill="#5A6A64">Desktop &amp; mobile browser</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="250" y1="234" x2="282.0" y2="234.0" stroke="#1F634D" stroke-width="2.4"/>
  <polygon points="288.0,234.0 279.0,238.5 279.0,229.5" fill="#1F634D"/>

  <!-- Column 2: Web App -->
  <rect x="292" y="108" width="244" height="252" rx="10" fill="#FAFBF9" stroke="#1F634D" stroke-width="2"/>
  <path d="M 302 108 H 526 Q 536 108 536 118 V 150 H 292 V 118 Q 292 108 302 108 Z" fill="#1F634D"/>
  <text x="414" y="135" font-family="Arial, Liberation Sans, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Web App (React 19)</text>
  <text x="310" y="184" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Responsive 5-tab layout</text>
  <text x="310" y="220" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Explore &amp; Bookshelf</text>
  <text x="310" y="256" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Daily plan &amp; quick undo</text>
  <text x="310" y="292" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Session offline reading</text>
  <text x="310" y="334" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1F634D">TypeScript · WCAG 2.2 AA</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="536" y1="234" x2="578.0" y2="234.0" stroke="#1F634D" stroke-width="2.4"/>
  <polygon points="584.0,234.0 575.0,238.5 575.0,229.5" fill="#1F634D"/>
  <text x="560" y="223" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#1F634D" text-anchor="middle">HTTPS</text>

  <!-- Column 3: Backend API -->
  <rect x="588" y="108" width="244" height="252" rx="10" fill="#FAFBF9" stroke="#1F634D" stroke-width="2"/>
  <path d="M 598 108 H 822 Q 832 108 832 118 V 150 H 588 V 118 Q 588 108 598 108 Z" fill="#1F634D"/>
  <text x="710" y="135" font-family="Arial, Liberation Sans, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Backend API (Express 5)</text>
  <text x="606" y="184" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Account sign-in checks</text>
  <text x="606" y="220" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Request validation</text>
  <text x="606" y="256" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Caching &amp; rate limits</text>
  <text x="606" y="292" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Private API keys on server</text>
  <text x="606" y="334" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1F634D">Node.js · Cloud Functions</text>

  <!-- Arrows 3 -> 4 -->
  <line x1="832" y1="176" x2="874.9" y2="149.2" stroke="#2B6CB0" stroke-width="2.2"/>
  <polygon points="880.0,146.0 874.8,154.6 870.0,147.0" fill="#2B6CB0"/>
  <line x1="832" y1="234" x2="874.0" y2="234.0" stroke="#1F634D" stroke-width="2.2"/>
  <polygon points="880.0,234.0 871.0,238.5 871.0,229.5" fill="#1F634D"/>
  <line x1="832" y1="292" x2="874.8" y2="317.0" stroke="#7C4D8B" stroke-width="2.2"/>
  <polygon points="880.0,320.0 870.0,319.4 874.5,311.6" fill="#7C4D8B"/>

  <!-- Column 4: Downstream Services -->
  <rect x="884" y="108" width="276" height="74" rx="8" fill="#F3F7FB" stroke="#2B6CB0" stroke-width="1.6"/>
  <text x="902" y="136" font-family="Arial, Liberation Sans, sans-serif" font-size="14.5" font-weight="700" fill="#2B6CB0">External Web Services</text>
  <text x="902" y="160" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" fill="#1A2B29">Open Library · Open-Meteo · Gemini AI</text>

  <line x1="1022" y1="182" x2="1022.0" y2="189.0" stroke="#C25525" stroke-width="1.8" stroke-dasharray="3 2"/>
  <polygon points="1022.0,195.0 1017.5,186.0 1026.5,186.0" fill="#C25525"/>

  <rect x="884" y="198" width="276" height="74" rx="8" fill="#F0F5F2" stroke="#1F634D" stroke-width="1.6"/>
  <text x="902" y="226" font-family="Arial, Liberation Sans, sans-serif" font-size="14.5" font-weight="700" fill="#1F634D">Reviewed Activity Catalog</text>
  <text x="902" y="250" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" fill="#1A2B29">Activities, milestones &amp; local rhymes</text>

  <rect x="884" y="286" width="276" height="74" rx="8" fill="#F7F3F9" stroke="#7C4D8B" stroke-width="1.6"/>
  <text x="902" y="314" font-family="Arial, Liberation Sans, sans-serif" font-size="14.5" font-weight="700" fill="#7C4D8B">Cloud Firestore &amp; Auth</text>
  <text x="902" y="338" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" fill="#1A2B29">Private family records &amp; data export</text>

  <!-- Down connector to outcome -->
  <line x1="414" y1="360" x2="414.0" y2="388.0" stroke="#1F634D" stroke-width="2.4"/>
  <polygon points="414.0,394.0 409.5,385.0 418.5,385.0" fill="#1F634D"/>

  <!-- Outcome Banner -->
  <rect x="40" y="398" width="1120" height="86" rx="10" fill="#F4F2E8" stroke="#1F634D" stroke-width="1.6"/>
  <text x="64" y="432" font-family="Arial, Liberation Sans, sans-serif" font-size="16" font-weight="700" fill="#1F634D">Goal: Calm, Screen-Free Play at Home</text>
  <text x="64" y="458" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">Caregivers find an activity, story idea, or weather tip in seconds, set the screen aside, and play.</text>
</svg>
