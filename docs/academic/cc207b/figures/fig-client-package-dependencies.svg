<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <filter id="shadow-pkg" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <marker id="arr-pkg" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1F634D"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#FDFDFB" rx="8" stroke="#E2E8E2" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="32" font-size="15" font-weight="700" fill="#1F634D">Figure 1.1: Flutter Client Package Dependency Architecture</text>
  <text x="32" y="48" font-size="11" fill="#5A655F">Disciplined dependency minimization ensuring rapid compilation, sound null-safety, and zero bridge serialization overhead</text>
  <line x1="32" y1="58" x2="768" y2="58" stroke="#E2E8E2" stroke-width="1.2"/>

  <!-- Root Package -->
  <g transform="translate(260, 75)">
    <rect width="280" height="42" rx="6" fill="#1F634D" filter="url(#shadow-pkg)"/>
    <text x="140" y="26" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">littlesteps_flutter (Root Package)</text>
  </g>

  <!-- Connector Spine -->
  <path d="M 400 117 L 400 142" stroke="#1F634D" stroke-width="1.8" fill="none"/>
  <path d="M 85 142 L 715 142" stroke="#1F634D" stroke-width="1.8" fill="none"/>

  <!-- Drop lines -->
  <path d="M 85 142 L 85 160" stroke="#1F634D" stroke-width="1.8" fill="none" marker-end="url(#arr-pkg)"/>
  <path d="M 235 142 L 235 160" stroke="#1F634D" stroke-width="1.8" fill="none" marker-end="url(#arr-pkg)"/>
  <path d="M 400 142 L 400 160" stroke="#1F634D" stroke-width="1.8" fill="none" marker-end="url(#arr-pkg)"/>
  <path d="M 565 142 L 565 160" stroke="#1F634D" stroke-width="1.8" fill="none" marker-end="url(#arr-pkg)"/>
  <path d="M 715 142 L 715 160" stroke="#1F634D" stroke-width="1.8" fill="none" marker-end="url(#arr-pkg)"/>

  <!-- Package 1: flutter/material.dart -->
  <g transform="translate(20, 162)">
    <rect width="130" height="90" rx="5" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-pkg)"/>
    <rect width="130" height="22" rx="5" fill="#F4F2E8"/>
    <text x="65" y="15" font-size="9" font-weight="700" fill="#2D312E" text-anchor="middle">flutter/material.dart</text>
    <text x="8" y="36" font-size="8" font-weight="600" fill="#1F634D">Material 3 Theming</text>
    <text x="8" y="50" font-size="7.5" fill="#5A655F">• Scaffold, AppBar</text>
    <text x="8" y="62" font-size="7.5" fill="#5A655F">• NavigationBar, Card</text>
    <text x="8" y="74" font-size="7.5" fill="#5A655F">• Design tokens</text>
  </g>

  <!-- Package 2: package:http -->
  <g transform="translate(170, 162)">
    <rect width="130" height="120" rx="5" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.5" filter="url(#shadow-pkg)"/>
    <rect width="130" height="22" rx="5" fill="#1F634D"/>
    <text x="65" y="15" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">package:http (^1.6.0)</text>
    <text x="8" y="36" font-size="8" font-weight="600" fill="#1F634D">Async Network Gateway</text>
    <text x="8" y="50" font-size="7.5" fill="#5A655F">• Centralized ApiClient</text>
    <text x="8" y="62" font-size="7.5" fill="#5A655F">• Bearer token injection</text>
    <text x="8" y="74" font-size="7.5" fill="#5A655F">• 8s timeout guards</text>
    <rect x="6" y="86" width="118" height="24" rx="3" fill="#E2E8E2"/>
    <text x="65" y="102" font-size="7.5" font-weight="600" fill="#1F634D" text-anchor="middle">lib/services/api_client.dart</text>
  </g>

  <!-- Package 3: package:intl -->
  <g transform="translate(325, 162)">
    <rect width="150" height="90" rx="5" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-pkg)"/>
    <rect width="150" height="22" rx="5" fill="#F4F2E8"/>
    <text x="75" y="15" font-size="9" font-weight="700" fill="#2D312E" text-anchor="middle">package:intl (^0.20.3)</text>
    <text x="8" y="36" font-size="8" font-weight="600" fill="#1F634D">Date &amp; Chronology</text>
    <text x="8" y="50" font-size="7.5" fill="#5A655F">• Coarse birthMonth parsing</text>
    <text x="8" y="62" font-size="7.5" fill="#5A655F">• ISO-8601 formatting</text>
    <text x="8" y="74" font-size="7.5" fill="#5A655F">• ECCD age bracket math</text>
  </g>

  <!-- Package 4: package:cupertino_icons -->
  <g transform="translate(495, 162)">
    <rect width="140" height="90" rx="5" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-pkg)"/>
    <rect width="140" height="22" rx="5" fill="#F4F2E8"/>
    <text x="70" y="15" font-size="9" font-weight="700" fill="#2D312E" text-anchor="middle">package:cupertino_icons</text>
    <text x="8" y="36" font-size="8" font-weight="600" fill="#1F634D">Vector Iconography</text>
    <text x="8" y="50" font-size="7.5" fill="#5A655F">• High-contrast glyphs</text>
    <text x="8" y="62" font-size="7.5" fill="#5A655F">• 5-Tab Navigation icons</text>
    <text x="8" y="74" font-size="7.5" fill="#5A655F">• Status view indicators</text>
  </g>

  <!-- Package 5: package:flutter_lints -->
  <g transform="translate(650, 162)">
    <rect width="130" height="90" rx="5" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-pkg)"/>
    <rect width="130" height="22" rx="5" fill="#F4F2E8"/>
    <text x="65" y="15" font-size="9" font-weight="700" fill="#2D312E" text-anchor="middle">package:flutter_lints</text>
    <text x="8" y="36" font-size="8" font-weight="600" fill="#1F634D">Static Code Analysis</text>
    <text x="8" y="50" font-size="7.5" fill="#5A655F">• Effective Dart rules</text>
    <text x="8" y="62" font-size="7.5" fill="#5A655F">• Zero compiler warnings</text>
    <text x="8" y="74" font-size="7.5" fill="#5A655F">• Sound null-safety lints</text>
  </g>
</svg>