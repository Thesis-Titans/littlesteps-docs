<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
  <defs>
    <filter id="shadow-feat" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" fill="#FFFFFF" rx="6" stroke="#D1DCD1" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="30" font-size="14.5" font-weight="700" fill="#1F634D">Figure 2.0: Shell Navigation and Core Features Architecture</text>
  <text x="28" y="46" font-size="11" fill="#5A655F">Root ShellScreen architecture mapping five navigation tabs to seven implemented core user flows</text>
  <line x1="28" y1="56" x2="772" y2="56" stroke="#E2E8E2" stroke-width="1"/>

  <!-- Root Shell Box -->
  <g transform="translate(240, 72)">
    <rect width="320" height="50" rx="5" fill="#1F634D" filter="url(#shadow-feat)"/>
    <text x="160" y="23" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">ShellScreen (Application Shell)</text>
    <text x="160" y="39" font-size="9" fill="#E2E8E2" text-anchor="middle">Shell AppBar &#8226; ChildChip &#8226; AccountSheet &#8226; 5-Tab NavigationBar</text>
  </g>

  <!-- Connector Spine -->
  <line x1="400" y1="122" x2="400" y2="148" stroke="#1F634D" stroke-width="1.8"/>
  <line x1="85" y1="148" x2="700" y2="148" stroke="#1F634D" stroke-width="1.8"/>

  <!-- Vertical drops to 5 Tabs with arrowheads -->
  <line x1="85" y1="148" x2="85" y2="168" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="81,164 85,172 89,164" fill="#1F634D"/>

  <line x1="235" y1="148" x2="235" y2="168" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="231,164 235,172 239,164" fill="#1F634D"/>

  <line x1="390" y1="148" x2="390" y2="168" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="386,164 390,172 394,164" fill="#1F634D"/>

  <line x1="540" y1="148" x2="540" y2="168" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="536,164 540,172 544,164" fill="#1F634D"/>

  <line x1="700" y1="148" x2="700" y2="168" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="696,164 700,172 704,164" fill="#1F634D"/>

  <!-- Tab 1: Today -->
  <g transform="translate(25, 172)">
    <rect width="120" height="182" rx="4" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="120" height="24" rx="4" fill="#F4F2E8"/>
    <text x="60" y="16" font-size="10" font-weight="700" fill="#2D312E" text-anchor="middle">Tab 1: Today</text>
    <text x="10" y="42" font-size="9" font-weight="700" fill="#1F634D">Feature 2: Daily Routine</text>
    <text x="10" y="56" font-size="8" fill="#5A655F">• Activity checklist</text>
    <text x="10" y="70" font-size="8" fill="#5A655F">• Completion toggle</text>
    <text x="10" y="84" font-size="8" fill="#5A655F">• Weather guidance</text>
    <text x="10" y="98" font-size="8" fill="#5A655F">• Optimistic UI updates</text>
    <text x="10" y="112" font-size="8" fill="#5A655F">• Revert completion</text>
    <rect x="8" y="152" width="104" height="20" rx="3" fill="#E2E8E2"/>
    <text x="60" y="165" font-size="8" font-weight="600" fill="#1F634D" text-anchor="middle">lib/screens/today</text>
  </g>

  <!-- Tab 2: Explore -->
  <g transform="translate(165, 172)">
    <rect width="140" height="182" rx="4" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="140" height="24" rx="4" fill="#1F634D"/>
    <text x="70" y="16" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tab 2: Explore</text>
    
    <text x="8" y="38" font-size="8.5" font-weight="700" fill="#1F634D">Feature 3: ECCD Catalog</text>
    <text x="8" y="50" font-size="7.8" fill="#5A655F">• 4 developmental domains</text>
    <text x="8" y="62" font-size="7.8" fill="#5A655F">• Setting &amp; duration filters</text>
    <text x="8" y="74" font-size="7.8" fill="#5A655F">• Canonical NoChildrenView</text>

    <line x1="8" y1="84" x2="132" y2="84" stroke="#E2E8E2" stroke-width="1"/>

    <text x="8" y="98" font-size="8.5" font-weight="700" fill="#3B7EA1">Feature 7: AI Play Helper</text>
    <text x="8" y="110" font-size="7.8" fill="#5A655F">• In-situ IdeaHelperCard</text>
    <text x="8" y="122" font-size="7.8" fill="#5A655F">• Gemini 2.5 Flash Lite</text>
    <text x="8" y="134" font-size="7.8" fill="#5A655F">• 3-tier catalog fallback</text>

    <rect x="8" y="152" width="124" height="20" rx="3" fill="#E2E8E2"/>
    <text x="70" y="165" font-size="8" font-weight="600" fill="#1F634D" text-anchor="middle">lib/screens/explore</text>
  </g>

  <!-- Tab 3: Books -->
  <g transform="translate(325, 172)">
    <rect width="130" height="182" rx="4" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="130" height="24" rx="4" fill="#F4F2E8"/>
    <text x="65" y="16" font-size="10" font-weight="700" fill="#2D312E" text-anchor="middle">Tab 3: Books</text>
    <text x="10" y="42" font-size="9" font-weight="700" fill="#1F634D">Feature 4: Storybooks</text>
    <text x="10" y="56" font-size="8" fill="#5A655F">• Open Library curation</text>
    <text x="10" y="70" font-size="8" fill="#5A655F">• Philippine folk rhymes</text>
    <text x="18" y="82" font-size="7.5" fill="#71717A">(Tagalog, Hiligaynon)</text>
    <text x="10" y="96" font-size="8" fill="#5A655F">• Physical hand motions</text>
    <text x="10" y="110" font-size="8" fill="#5A655F">• Story companion AI</text>
    <rect x="8" y="152" width="114" height="20" rx="3" fill="#E2E8E2"/>
    <text x="65" y="165" font-size="8" font-weight="600" fill="#1F634D" text-anchor="middle">lib/screens/bookshelf</text>
  </g>

  <!-- Tab 4: Milestones -->
  <g transform="translate(475, 172)">
    <rect width="130" height="182" rx="4" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="130" height="24" rx="4" fill="#F4F2E8"/>
    <text x="65" y="16" font-size="10" font-weight="700" fill="#2D312E" text-anchor="middle">Tab 4: Milestones</text>
    <text x="10" y="42" font-size="9" font-weight="700" fill="#1F634D">Feature 5: Milestones</text>
    <text x="10" y="56" font-size="8" fill="#5A655F">• Non-clinical prompts</text>
    <text x="10" y="70" font-size="8" fill="#5A655F">• Domain checklists</text>
    <text x="10" y="84" font-size="8" fill="#5A655F">• Observation sheets</text>
    <text x="10" y="98" font-size="8" fill="#5A655F">• Zero diagnostic label</text>
    <text x="10" y="112" font-size="8" fill="#5A655F">• Parent play records</text>
    <rect x="8" y="152" width="114" height="20" rx="3" fill="#E2E8E2"/>
    <text x="65" y="165" font-size="8" font-weight="600" fill="#1F634D" text-anchor="middle">lib/screens/milestones</text>
  </g>

  <!-- Tab 5: Journal + Child Profile -->
  <g transform="translate(625, 172)">
    <rect width="150" height="182" rx="4" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="150" height="24" rx="4" fill="#F4F2E8"/>
    <text x="75" y="16" font-size="10" font-weight="700" fill="#2D312E" text-anchor="middle">Tab 5: Journal / Profile</text>
    <text x="10" y="38" font-size="8.5" font-weight="700" fill="#1F634D">Feature 6: Private Journal</text>
    <text x="10" y="50" font-size="7.8" fill="#5A655F">• 2,000-character entries</text>
    <text x="10" y="62" font-size="7.8" fill="#5A655F">• Strict RA 10173 isolation</text>
    
    <line x1="8" y1="74" x2="142" y2="74" stroke="#E2E8E2" stroke-width="1"/>

    <text x="10" y="88" font-size="8.5" font-weight="700" fill="#1F634D">Feature 1: Child Profile</text>
    <text x="10" y="100" font-size="7.8" fill="#5A655F">• Coarse birthMonth only</text>
    <text x="10" y="112" font-size="7.8" fill="#5A655F">• 7 ECCD Age Brackets</text>
    <text x="10" y="124" font-size="7.8" fill="#5A655F">• Input form validation</text>

    <rect x="8" y="152" width="134" height="20" rx="3" fill="#E2E8E2"/>
    <text x="75" y="165" font-size="8" font-weight="600" fill="#1F634D" text-anchor="middle">lib/screens/children &amp; journal</text>
  </g>
</svg>