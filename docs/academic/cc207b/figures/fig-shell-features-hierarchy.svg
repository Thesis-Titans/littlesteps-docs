<svg xmlns="http://www.w3.org/2000/svg" width="800" height="395" viewBox="0 0 800 395" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
  <defs>
    <filter id="shadow-feat" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="395" fill="#FFFFFF" rx="6" stroke="#D1DCD1" stroke-width="1"/>

  <!-- Header -->
  <text x="25" y="30" font-size="14.5" font-weight="700" fill="#1F634D">Shell Navigation and Core Features Architecture</text>
  <text x="25" y="46" font-size="11" fill="#5A655F">Root ShellScreen mapping 5 bottom tabs, Child Profile management, and AI Idea Helper (7 core flows)</text>
  <line x1="25" y1="56" x2="775" y2="56" stroke="#E2E8E2" stroke-width="1"/>

  <!-- Root Shell Box -->
  <g transform="translate(130, 70)">
    <rect width="540" height="56" rx="5" fill="#1F634D" filter="url(#shadow-feat)"/>
    <text x="270" y="21" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">ShellScreen (Root Navigation Shell)</text>
    <text x="270" y="36" font-size="8.6" fill="#E2E8E2" text-anchor="middle">Top Bar: BrandLogo · Feature 1: Child Profile Switcher (ChildChip → lib/screens/children) · AccountMenuSheet</text>
    <text x="270" y="49" font-size="8.2" fill="#C7DDD3" text-anchor="middle">NavigationBar / Rail (IndexedStack · 5 Tabs) + Canonical NoChildrenView when 0 children registered</text>
  </g>

  <!-- Connector Spine -->
  <line x1="400" y1="126" x2="400" y2="148" stroke="#1F634D" stroke-width="1.8"/>
  <line x1="94" y1="148" x2="706" y2="148" stroke="#1F634D" stroke-width="1.8"/>

  <!-- Drop lines with arrowheads into 5 equal columns -->
  <line x1="94" y1="148" x2="94" y2="166" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="90,162 94,170 98,162" fill="#1F634D"/>

  <line x1="247" y1="148" x2="247" y2="166" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="243,162 247,170 251,162" fill="#1F634D"/>

  <line x1="400" y1="148" x2="400" y2="166" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="396,162 400,170 404,162" fill="#1F634D"/>

  <line x1="553" y1="148" x2="553" y2="166" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="549,162 553,170 557,162" fill="#1F634D"/>

  <line x1="706" y1="148" x2="706" y2="166" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="702,162 706,170 710,162" fill="#1F634D"/>

  <!-- Tab 1: Today -->
  <g transform="translate(25, 170)">
    <rect width="138" height="196" rx="4" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="138" height="24" rx="4" fill="#F4F2E8"/>
    <text x="69" y="16" font-size="10" font-weight="700" fill="#2D312E" text-anchor="middle">Tab 1: Today</text>
    <text x="8" y="42" font-size="8.4" font-weight="700" fill="#1F634D">Feature 2: Daily Plan</text>
    <text x="8" y="57" font-size="7.8" fill="#5A655F">• Scheduled play cards</text>
    <text x="8" y="71" font-size="7.8" fill="#5A655F">• Completion toggle</text>
    <text x="8" y="85" font-size="7.8" fill="#5A655F">• Open-Meteo hint</text>
    <text x="8" y="99" font-size="7.8" fill="#5A655F">• LocalDataCache read</text>
    <text x="8" y="113" font-size="7.8" fill="#5A655F">• OfflineBanner state</text>
    <rect x="8" y="164" width="122" height="22" rx="3" fill="#E2E8E2"/>
    <text x="69" y="178" font-size="8.2" font-weight="500" fill="#1F634D" text-anchor="middle">lib/screens/today</text>
  </g>

  <!-- Tab 2: Explore (Catalog + AI Idea Helper) -->
  <g transform="translate(178, 170)">
    <rect width="138" height="196" rx="4" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="138" height="24" rx="4" fill="#1F634D"/>
    <text x="69" y="16" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tab 2: Explore</text>

    <text x="8" y="40" font-size="8.2" font-weight="700" fill="#1F634D">Feature 3: Catalog</text>
    <text x="8" y="53" font-size="7.5" fill="#5A655F">• 4 domains &amp; filters</text>
    <text x="8" y="65" font-size="7.5" fill="#5A655F">• Firestore rhymes &amp; books</text>
    <text x="8" y="77" font-size="7.5" fill="#5A655F">• ActivityDetailScreen</text>

    <line x1="8" y1="88" x2="130" y2="88" stroke="#E2E8E2" stroke-width="1"/>

    <text x="8" y="102" font-size="8.2" font-weight="700" fill="#3B7EA1">Feature 7: AI Helper</text>
    <text x="8" y="115" font-size="7.5" fill="#5A655F">• IdeaHelperEntryCard</text>
    <text x="8" y="127" font-size="7.5" fill="#5A655F">• Route: /ai-suggest</text>
    <text x="8" y="139" font-size="7.5" fill="#5A655F">• Gemini + catalog fallback</text>

    <rect x="8" y="164" width="122" height="22" rx="3" fill="#E2E8E2"/>
    <text x="69" y="178" font-size="7.8" font-weight="500" fill="#1F634D" text-anchor="middle">explore/ &amp; ai/</text>
  </g>

  <!-- Tab 3: Milestones -->
  <g transform="translate(331, 170)">
    <rect width="138" height="196" rx="4" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="138" height="24" rx="4" fill="#F4F2E8"/>
    <text x="69" y="16" font-size="10" font-weight="700" fill="#2D312E" text-anchor="middle">Tab 3: Milestones</text>
    <text x="8" y="42" font-size="8.4" font-weight="700" fill="#1F634D">Feature 4: Milestones</text>
    <text x="8" y="57" font-size="7.8" fill="#5A655F">• Non-clinical prompts</text>
    <text x="8" y="71" font-size="7.8" fill="#5A655F">• 4 domains · 6 age bands</text>
    <text x="8" y="85" font-size="7.8" fill="#5A655F">• ObservationFormSheet</text>
    <text x="8" y="99" font-size="7.8" fill="#5A655F">• Zero diagnostic scores</text>
    <text x="8" y="113" font-size="7.8" fill="#5A655F">• API prompts &amp; dated logs</text>
    <rect x="8" y="164" width="122" height="22" rx="3" fill="#E2E8E2"/>
    <text x="69" y="178" font-size="8" font-weight="500" fill="#1F634D" text-anchor="middle">lib/screens/milestones</text>
  </g>

  <!-- Tab 4: Journal -->
  <g transform="translate(484, 170)">
    <rect width="138" height="196" rx="4" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="138" height="24" rx="4" fill="#F4F2E8"/>
    <text x="69" y="16" font-size="10" font-weight="700" fill="#2D312E" text-anchor="middle">Tab 4: Journal</text>
    <text x="8" y="42" font-size="8.4" font-weight="700" fill="#1F634D">Feature 5: Journal</text>
    <text x="8" y="57" font-size="7.8" fill="#5A655F">• Chronological notes</text>
    <text x="8" y="71" font-size="7.8" fill="#5A655F">• Caregiver-scoped data</text>
    <text x="8" y="85" font-size="7.8" fill="#5A655F">• Excluded from AI calls</text>
    <text x="8" y="99" font-size="7.8" fill="#5A655F">• Excluded from cache</text>
    <text x="8" y="113" font-size="7.8" fill="#5A655F">• RA 10173 privacy</text>
    <rect x="8" y="164" width="122" height="22" rx="3" fill="#E2E8E2"/>
    <text x="69" y="178" font-size="8.2" font-weight="500" fill="#1F634D" text-anchor="middle">lib/screens/journal</text>
  </g>

  <!-- Tab 5: This week -->
  <g transform="translate(637, 170)">
    <rect width="138" height="196" rx="4" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="138" height="24" rx="4" fill="#F4F2E8"/>
    <text x="69" y="16" font-size="10" font-weight="700" fill="#2D312E" text-anchor="middle">Tab 5: This week</text>
    <text x="8" y="42" font-size="8.4" font-weight="700" fill="#1F634D">Feature 6: Reflection</text>
    <text x="8" y="57" font-size="7.8" fill="#5A655F">• WeeklySummaryScreen</text>
    <text x="8" y="71" font-size="7.8" fill="#5A655F">• Monday–Sunday picker</text>
    <text x="8" y="85" font-size="7.8" fill="#5A655F">• Domain activity counts</text>
    <text x="8" y="99" font-size="7.8" fill="#5A655F">• Factual reflection cards</text>
    <text x="8" y="113" font-size="7.8" fill="#5A655F">• Supportive empty view</text>
    <rect x="8" y="164" width="122" height="22" rx="3" fill="#E2E8E2"/>
    <text x="69" y="178" font-size="8" font-weight="500" fill="#1F634D" text-anchor="middle">lib/screens/reflection</text>
  </g>
</svg>
