<svg xmlns="http://www.w3.org/2000/svg" width="800" height="385" viewBox="0 0 800 385" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
  <defs>
    <filter id="shadow-feat" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="385" fill="#FFFFFF" rx="6" stroke="#D1DCD1" stroke-width="1"/>

  <!-- Header -->
  <text x="25" y="30" font-size="14.5" font-weight="700" fill="#1F634D">Shell Navigation and Core Features Architecture</text>
  <text x="25" y="46" font-size="11" fill="#5A655F">Root ShellScreen architecture mapping five navigation tabs to seven implemented core user flows</text>
  <line x1="25" y1="56" x2="775" y2="56" stroke="#E2E8E2" stroke-width="1"/>

  <!-- Root Shell Box (Centered exactly at X=400) -->
  <g transform="translate(240, 72)">
    <rect width="320" height="50" rx="5" fill="#1F634D" filter="url(#shadow-feat)"/>
    <text x="160" y="23" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">ShellScreen (Application Shell)</text>
    <text x="160" y="39" font-size="9" fill="#E2E8E2" text-anchor="middle">Shell AppBar &#8226; ChildChip &#8226; AccountSheet &#8226; 5-Tab NavigationBar</text>
  </g>

  <!-- Connector Spine -->
  <line x1="400" y1="122" x2="400" y2="146" stroke="#1F634D" stroke-width="1.8"/>
  <line x1="94" y1="146" x2="706" y2="146" stroke="#1F634D" stroke-width="1.8"/>

  <!-- Drop lines with arrowheads into 5 equal columns -->
  <line x1="94" y1="146" x2="94" y2="164" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="90,160 94,168 98,160" fill="#1F634D"/>

  <line x1="247" y1="146" x2="247" y2="164" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="243,160 247,168 251,160" fill="#1F634D"/>

  <line x1="400" y1="146" x2="400" y2="164" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="396,160 400,168 404,160" fill="#1F634D"/>

  <line x1="553" y1="146" x2="553" y2="164" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="549,160 553,168 557,160" fill="#1F634D"/>

  <line x1="706" y1="146" x2="706" y2="164" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="702,160 706,168 710,160" fill="#1F634D"/>

  <!-- Tab 1: Today -->
  <g transform="translate(25, 168)">
    <rect width="138" height="186" rx="4" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="138" height="24" rx="4" fill="#F4F2E8"/>
    <text x="69" y="16" font-size="10" font-weight="700" fill="#2D312E" text-anchor="middle">Tab 1: Today</text>
    <text x="8" y="42" font-size="8.5" font-weight="700" fill="#1F634D">Feature 2: Daily Routine</text>
    <text x="8" y="56" font-size="7.8" fill="#5A655F">• Activity checklist</text>
    <text x="8" y="70" font-size="7.8" fill="#5A655F">• Completion toggle</text>
    <text x="8" y="84" font-size="7.8" fill="#5A655F">• Weather guidance</text>
    <text x="8" y="98" font-size="7.8" fill="#5A655F">• Optimistic UI updates</text>
    <text x="8" y="112" font-size="7.8" fill="#5A655F">• Revert completion</text>
    <rect x="8" y="154" width="122" height="22" rx="3" fill="#E2E8E2"/>
    <text x="69" y="168" font-size="8.5" font-weight="500" fill="#1F634D" text-anchor="middle">lib/screens/today</text>
  </g>

  <!-- Tab 2: Explore (Highlighted Feature Carrier) -->
  <g transform="translate(178, 168)">
    <rect width="138" height="186" rx="4" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="138" height="24" rx="4" fill="#1F634D"/>
    <text x="69" y="16" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tab 2: Explore</text>
    
    <text x="8" y="39" font-size="8.2" font-weight="700" fill="#1F634D">Feature 3: ECCD Catalog</text>
    <text x="8" y="51" font-size="7.5" fill="#5A655F">• 4 developmental domains</text>
    <text x="8" y="63" font-size="7.5" fill="#5A655F">• Setting &amp; duration filters</text>
    <text x="8" y="75" font-size="7.5" fill="#5A655F">• Canonical NoChildrenView</text>

    <line x1="8" y1="84" x2="130" y2="84" stroke="#E2E8E2" stroke-width="1"/>

    <text x="8" y="97" font-size="8.2" font-weight="700" fill="#3B7EA1">Feature 7: AI Play Helper</text>
    <text x="8" y="109" font-size="7.5" fill="#5A655F">• In-situ IdeaHelperCard</text>
    <text x="8" y="121" font-size="7.5" fill="#5A655F">• Gemini 2.5 Flash Lite</text>
    <text x="8" y="133" font-size="7.5" fill="#5A655F">• 3-tier catalog fallback</text>

    <rect x="8" y="154" width="122" height="22" rx="3" fill="#E2E8E2"/>
    <text x="69" y="168" font-size="8.5" font-weight="500" fill="#1F634D" text-anchor="middle">lib/screens/explore</text>
  </g>

  <!-- Tab 3: Books (Directly Under Root Center) -->
  <g transform="translate(331, 168)">
    <rect width="138" height="186" rx="4" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="138" height="24" rx="4" fill="#F4F2E8"/>
    <text x="69" y="16" font-size="10" font-weight="700" fill="#2D312E" text-anchor="middle">Tab 3: Books</text>
    <text x="8" y="42" font-size="8.5" font-weight="700" fill="#1F634D">Feature 4: Storybooks</text>
    <text x="8" y="56" font-size="7.8" fill="#5A655F">• Open Library curation</text>
    <text x="8" y="70" font-size="7.8" fill="#5A655F">• Philippine folk rhymes</text>
    <text x="14" y="82" font-size="7.2" fill="#71717A">(Tagalog, Hiligaynon)</text>
    <text x="8" y="96" font-size="7.8" fill="#5A655F">• Physical hand motions</text>
    <text x="8" y="110" font-size="7.8" fill="#5A655F">• Story companion AI</text>
    <rect x="8" y="154" width="122" height="22" rx="3" fill="#E2E8E2"/>
    <text x="69" y="168" font-size="8.5" font-weight="500" fill="#1F634D" text-anchor="middle">lib/screens/bookshelf</text>
  </g>

  <!-- Tab 4: Milestones -->
  <g transform="translate(484, 168)">
    <rect width="138" height="186" rx="4" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="138" height="24" rx="4" fill="#F4F2E8"/>
    <text x="69" y="16" font-size="10" font-weight="700" fill="#2D312E" text-anchor="middle">Tab 4: Milestones</text>
    <text x="8" y="42" font-size="8.5" font-weight="700" fill="#1F634D">Feature 5: Milestones</text>
    <text x="8" y="56" font-size="7.8" fill="#5A655F">• Non-clinical prompts</text>
    <text x="8" y="70" font-size="7.8" fill="#5A655F">• Domain checklists</text>
    <text x="8" y="84" font-size="7.8" fill="#5A655F">• Observation sheets</text>
    <text x="8" y="98" font-size="7.8" fill="#5A655F">• Zero diagnostic label</text>
    <text x="8" y="112" font-size="7.8" fill="#5A655F">• Parent play records</text>
    <rect x="8" y="154" width="122" height="22" rx="3" fill="#E2E8E2"/>
    <text x="69" y="168" font-size="8.5" font-weight="500" fill="#1F634D" text-anchor="middle">lib/screens/milestones</text>
  </g>

  <!-- Tab 5: Journal / Profile -->
  <g transform="translate(637, 168)">
    <rect width="138" height="186" rx="4" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-feat)"/>
    <rect width="138" height="24" rx="4" fill="#F4F2E8"/>
    <text x="69" y="16" font-size="10" font-weight="700" fill="#2D312E" text-anchor="middle">Tab 5: Journal / Profile</text>
    <text x="8" y="39" font-size="8.2" font-weight="700" fill="#1F634D">Feature 6: Private Journal</text>
    <text x="8" y="51" font-size="7.5" fill="#5A655F">• 2,000-character entries</text>
    <text x="8" y="63" font-size="7.5" fill="#5A655F">• Strict RA 10173 isolation</text>
    
    <line x1="8" y1="74" x2="130" y2="74" stroke="#E2E8E2" stroke-width="1"/>

    <text x="8" y="88" font-size="8.2" font-weight="700" fill="#1F634D">Feature 1: Child Profile</text>
    <text x="8" y="100" font-size="7.5" fill="#5A655F">• Coarse birthMonth only</text>
    <text x="8" y="112" font-size="7.5" fill="#5A655F">• 7 ECCD Age Brackets</text>
    <text x="8" y="124" font-size="7.5" fill="#5A655F">• Input form validation</text>

    <rect x="8" y="154" width="122" height="22" rx="3" fill="#E2E8E2"/>
    <text x="69" y="168" font-size="8" font-weight="500" fill="#1F634D" text-anchor="middle">children/ &amp; journal/</text>
  </g>
</svg>
