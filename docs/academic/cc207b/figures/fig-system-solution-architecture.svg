<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <filter id="shadow-sys" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="340" fill="#FDFDFB" rx="8" stroke="#E2E8E2" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="34" font-size="15" font-weight="700" fill="#1F634D">Figure 1.0: LittleSteps System &amp; Solution Architecture</text>
  <text x="32" y="50" font-size="11" fill="#5A655F">Caregiver-facing digital companion facilitating offline, screen-free physical child interaction</text>
  <line x1="32" y1="60" x2="768" y2="60" stroke="#E2E8E2" stroke-width="1.2"/>

  <!-- Node A: Caregiver Inputs -->
  <g transform="translate(32, 80)">
    <rect width="135" height="135" rx="6" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.5" filter="url(#shadow-sys)"/>
    <rect width="135" height="26" rx="6" fill="#F4F2E8"/>
    <rect y="20" width="135" height="6" fill="#F4F2E8"/>
    <text x="67" y="17" font-size="10.5" font-weight="700" fill="#2D312E" text-anchor="middle">Caregiver Context</text>
    <text x="12" y="46" font-size="9" fill="#5A655F">• Age Band (&quot;12-23m&quot;)</text>
    <text x="12" y="62" font-size="9" fill="#5A655F">• Time: 15–30 mins</text>
    <text x="12" y="78" font-size="9" fill="#5A655F">• Recycled Items:</text>
    <text x="20" y="92" font-size="8.5" font-style="italic" fill="#71717A">Boxes, cups, spoons</text>
    <text x="12" y="108" font-size="9" fill="#5A655F">• Setting &amp; Weather</text>
    <text x="12" y="124" font-size="8.5" font-weight="600" fill="#1F634D">Input to Companion</text>
  </g>

  <!-- Connection A -> B -->
  <line x1="167" y1="147" x2="191" y2="147" stroke="#1F634D" stroke-width="2"/>
  <polygon points="189,143 197,147 189,151" fill="#1F634D"/>

  <!-- Node B: LittleSteps Flutter Client -->
  <g transform="translate(197, 80)">
    <rect width="155" height="135" rx="6" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.5" filter="url(#shadow-sys)"/>
    <rect width="155" height="26" rx="6" fill="#1F634D"/>
    <rect y="20" width="155" height="6" fill="#1F634D"/>
    <text x="77" y="17" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">LittleSteps Client (Flutter)</text>
    <text x="12" y="44" font-size="9" fill="#5A655F">• Dart SDK ^3.13.5</text>
    <text x="12" y="58" font-size="9" fill="#5A655F">• Material 3 Responsive UI</text>
    <text x="12" y="72" font-size="9" fill="#5A655F">• Shell Navigation (5 Tabs)</text>
    <text x="12" y="86" font-size="9" fill="#5A655F">• IdeaHelperCard Feed</text>
    <text x="12" y="100" font-size="9" fill="#5A655F">• Canonical NoChildrenView</text>
    <text x="12" y="118" font-size="8.5" font-weight="600" fill="#1F634D">Cross-Platform Native</text>
  </g>

  <!-- Connection B -> C -->
  <line x1="352" y1="147" x2="376" y2="147" stroke="#1F634D" stroke-width="2"/>
  <polygon points="374,143 382,147 374,151" fill="#1F634D"/>
  <text x="367" y="139" font-size="8" font-weight="700" fill="#1F634D" text-anchor="middle">HTTPS</text>

  <!-- Node C: Backend Proxy API -->
  <g transform="translate(382, 80)">
    <rect width="150" height="135" rx="6" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.5" filter="url(#shadow-sys)"/>
    <rect width="150" height="26" rx="6" fill="#1F634D"/>
    <rect y="20" width="150" height="6" fill="#1F634D"/>
    <text x="75" y="17" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">littlesteps-api (Node/TS)</text>
    <text x="12" y="44" font-size="9" fill="#5A655F">• Express BFF Gateway</text>
    <text x="12" y="58" font-size="9" fill="#5A655F">• Rate Limiting (10/hr)</text>
    <text x="12" y="72" font-size="9" fill="#5A655F">• Zod Validation Engine</text>
    <text x="12" y="86" font-size="9" fill="#5A655F">• Non-Diagnostic Denylist</text>
    <text x="12" y="100" font-size="9" fill="#5A655F">• Zero Client Credentials</text>
    <text x="12" y="118" font-size="8.5" font-weight="600" fill="#1F634D">Firebase Cloud Runtime</text>
  </g>

  <!-- Connectors C -> D, E, F -->
  <line x1="532" y1="105" x2="561" y2="95" stroke="#3B7EA1" stroke-width="1.8"/>
  <polygon points="557,91 567,93 559,99" fill="#3B7EA1"/>

  <line x1="532" y1="147" x2="561" y2="147" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="559,143 567,147 559,151" fill="#1F634D"/>

  <line x1="532" y1="188" x2="561" y2="200" stroke="#7A5C96" stroke-width="1.8"/>
  <polygon points="559,196 567,202 557,204" fill="#7A5C96"/>

  <!-- Node D: Cloud Gemini -->
  <g transform="translate(567, 72)">
    <rect width="200" height="48" rx="4" fill="#FFFFFF" stroke="#3B7EA1" stroke-width="1.2" filter="url(#shadow-sys)"/>
    <text x="10" y="18" font-size="9.5" font-weight="700" fill="#3B7EA1">Gemini 2.5 Flash Lite (Tier 1)</text>
    <text x="10" y="32" font-size="8.5" fill="#5A655F">Semantic rationale &amp; candidate ranking</text>
    <text x="10" y="43" font-size="7.5" fill="#71717A">@google/genai &#8226; 8s timeout guard</text>
  </g>

  <!-- Fallback D -> E -->
  <line x1="667" y1="120" x2="667" y2="124" stroke="#C85A32" stroke-width="1.5" stroke-dasharray="2 2"/>
  <polygon points="663,122 667,126 671,122" fill="#C85A32"/>

  <!-- Node E: ECCD Catalog -->
  <g transform="translate(567, 126)">
    <rect width="200" height="48" rx="4" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow-sys)"/>
    <text x="10" y="18" font-size="9.5" font-weight="700" fill="#1F634D">ECCD Activity Catalog (Tier 3)</text>
    <text x="10" y="32" font-size="8.5" fill="#5A655F">Deterministic early learning benchmarks</text>
    <text x="10" y="43" font-size="7.5" fill="#71717A">Offline guaranteed &#8226; Philippine ECCD</text>
  </g>

  <!-- Node F: Firestore Persistence -->
  <g transform="translate(567, 180)">
    <rect width="200" height="48" rx="4" fill="#FFFFFF" stroke="#7A5C96" stroke-width="1.2" filter="url(#shadow-sys)"/>
    <text x="10" y="18" font-size="9.5" font-weight="700" fill="#7A5C96">Google Cloud Firestore</text>
    <text x="10" y="32" font-size="8.5" fill="#5A655F">Private encrypted caregiver persistence</text>
    <text x="10" y="43" font-size="7.5" fill="#71717A">Isolated subcollections &#8226; RA 10173</text>
  </g>

  <!-- Target Outcome: Physical Screen-Free Play -->
  <g transform="translate(32, 245)">
    <rect width="735" height="65" rx="6" fill="#F4F2E8" stroke="#1F634D" stroke-width="1.5" filter="url(#shadow-sys)"/>
    <circle cx="40" cy="32" r="16" fill="#1F634D"/>
    <path d="M 40 22 C 34 22 31 27 34 33 C 37 38 40 41 40 41 C 40 41 43 38 46 33 C 49 27 46 22 40 22 Z" fill="#FFFFFF"/>
    <path d="M 40 26 L 40 37" stroke="#1F634D" stroke-width="1.2" stroke-linecap="round"/>
    <text x="70" y="27" font-size="12" font-weight="700" fill="#1F634D">Primary Sociotechnical Outcome: Screen-Free Physical Interaction</text>
    <text x="70" y="45" font-size="10" fill="#2D312E">Caregiver puts phone away after viewing steps &#8226; Engages toddler in physical hands-on motor/sensory play &#8226; Zero infant screen time</text>
  </g>
  <line x1="274" y1="215" x2="274" y2="241" stroke="#1F634D" stroke-width="2"/>
  <polygon points="270,237 274,245 278,237" fill="#1F634D"/>
</svg>