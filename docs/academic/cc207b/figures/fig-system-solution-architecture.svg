<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
  <defs>
    <filter id="shadow-sys" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="#FFFFFF" rx="6" stroke="#D1DCD1" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="30" font-size="14.5" font-weight="700" fill="#1F634D">LittleSteps System and Solution Architecture</text>
  <text x="28" y="46" font-size="11" fill="#5A655F">Caregiver-facing digital companion facilitating offline, screen-free physical child play</text>
  <line x1="28" y1="56" x2="772" y2="56" stroke="#E2E8E2" stroke-width="1"/>

  <!-- Node A: Caregiver Inputs -->
  <g transform="translate(28, 68)">
    <rect width="135" height="144" rx="5" fill="#FFFFFF" stroke="#D1DCD1" stroke-width="1.2" filter="url(#shadow-sys)"/>
    <rect width="135" height="26" rx="5" fill="#F4F2E8"/>
    <rect y="20" width="135" height="6" fill="#F4F2E8"/>
    <text x="67" y="17" font-size="10.5" font-weight="700" fill="#2D312E" text-anchor="middle">Caregiver Inputs</text>
    <text x="12" y="45" font-size="9" fill="#5A655F">• Child Age Band</text>
    <text x="20" y="58" font-size="8" fill="#71717A">(e.g., &quot;12-23m&quot;)</text>
    <text x="12" y="74" font-size="9" fill="#5A655F">• Available Materials</text>
    <text x="20" y="87" font-size="8" fill="#71717A">(household recyclables)</text>
    <text x="12" y="103" font-size="9" fill="#5A655F">• Available Time</text>
    <text x="20" y="116" font-size="8" fill="#71717A">(10 to 60 minutes)</text>
    <text x="12" y="132" font-size="9" fill="#5A655F">• Play Setting</text>
  </g>

  <!-- Connection A -> B -->
  <line x1="163" y1="140" x2="183" y2="140" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="181,136 187,140 181,144" fill="#1F634D"/>

  <!-- Node B: LittleSteps Mobile Client -->
  <g transform="translate(187, 68)">
    <rect width="160" height="144" rx="5" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow-sys)"/>
    <rect width="160" height="26" rx="5" fill="#1F634D"/>
    <rect y="20" width="160" height="6" fill="#1F634D"/>
    <text x="80" y="17" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mobile Client (Flutter)</text>
    <text x="12" y="45" font-size="9" fill="#5A655F">• Material 3 UI Layer</text>
    <text x="12" y="61" font-size="9" fill="#5A655F">• 5-Tab Shell Navigation</text>
    <text x="12" y="77" font-size="9" fill="#5A655F">• Idea Helper Feed Card</text>
    <text x="12" y="93" font-size="9" fill="#5A655F">• Offline Catalog Cache</text>
    <text x="12" y="109" font-size="9" fill="#5A655F">• Canonical NoChildrenView</text>
    <text x="12" y="130" font-size="8.5" font-weight="500" fill="#1F634D">Dart SDK ^3.13.5</text>
  </g>

  <!-- Connection B -> C -->
  <line x1="347" y1="140" x2="368" y2="140" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="366,136 372,140 366,144" fill="#1F634D"/>
  <text x="359" y="132" font-size="7.5" font-weight="700" fill="#1F634D" text-anchor="middle">HTTPS</text>

  <!-- Node C: Backend Proxy API -->
  <g transform="translate(372, 68)">
    <rect width="155" height="144" rx="5" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow-sys)"/>
    <rect width="155" height="26" rx="5" fill="#1F634D"/>
    <rect y="20" width="155" height="6" fill="#1F634D"/>
    <text x="77" y="17" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Backend Proxy API</text>
    <text x="12" y="45" font-size="9" fill="#5A655F">• Node.js / Express Gateway</text>
    <text x="12" y="61" font-size="9" fill="#5A655F">• Sliding Rate Limiting</text>
    <text x="12" y="77" font-size="9" fill="#5A655F">• Zod Schema Validation</text>
    <text x="12" y="93" font-size="9" fill="#5A655F">• Non-Diagnostic Denylist</text>
    <text x="12" y="109" font-size="9" fill="#5A655F">• Zero Client Credentials</text>
    <text x="12" y="130" font-size="8.5" font-weight="500" fill="#1F634D">littlesteps-api</text>
  </g>

  <!-- Connectors C -> D, E, F -->
  <line x1="527" y1="99" x2="558" y2="89" stroke="#3B7EA1" stroke-width="1.5"/>
  <polygon points="554,85 562,87 556,93" fill="#3B7EA1"/>

  <line x1="527" y1="140" x2="558" y2="140" stroke="#1F634D" stroke-width="1.5"/>
  <polygon points="556,136 562,140 556,144" fill="#1F634D"/>

  <line x1="527" y1="181" x2="558" y2="191" stroke="#7A5C96" stroke-width="1.5"/>
  <polygon points="556,187 562,193 554,195" fill="#7A5C96"/>

  <!-- Node D: Cloud Gemini (Tier 1) -->
  <g transform="translate(562, 68)">
    <rect width="210" height="42" rx="4" fill="#FFFFFF" stroke="#3B7EA1" stroke-width="1.2" filter="url(#shadow-sys)"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#3B7EA1">Gemini 2.5 Flash Lite (Tier 1)</text>
    <text x="10" y="28" font-size="8" fill="#5A655F">Catalog candidate ranking &amp; rationale</text>
    <text x="10" y="38" font-size="7.5" fill="#71717A">@google/genai &#8226; 8-second timeout guard</text>
  </g>

  <!-- Fallback D -> E -->
  <line x1="667" y1="110" x2="667" y2="115" stroke="#C85A32" stroke-width="1.2" stroke-dasharray="2 2"/>
  <polygon points="663,113 667,118 671,113" fill="#C85A32"/>

  <!-- Node E: ECCD Activity Catalog (Tier 3) -->
  <g transform="translate(562, 119)">
    <rect width="210" height="42" rx="4" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow-sys)"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#1F634D">ECCD Activity Catalog (Tier 3)</text>
    <text x="10" y="28" font-size="8" fill="#5A655F">Reviewed early learning curriculum pool</text>
    <text x="10" y="38" font-size="7.5" fill="#71717A">Deterministic fallback &#8226; Zero empty states</text>
  </g>

  <!-- Node F: Cloud Firestore Persistence -->
  <g transform="translate(562, 170)">
    <rect width="210" height="42" rx="4" fill="#FFFFFF" stroke="#7A5C96" stroke-width="1.2" filter="url(#shadow-sys)"/>
    <text x="10" y="16" font-size="9" font-weight="700" fill="#7A5C96">Cloud Firestore Database</text>
    <text x="10" y="28" font-size="8" fill="#5A655F">Encrypted caregiver &amp; child records</text>
    <text x="10" y="38" font-size="7.5" fill="#71717A">Isolated subcollections &#8226; RA 10173</text>
  </g>

  <!-- Terminal Outcome Box -->
  <g transform="translate(28, 242)">
    <rect width="744" height="74" rx="5" fill="#F4F2E8" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow-sys)"/>
    <text x="20" y="26" font-size="11.5" font-weight="700" fill="#1F634D">Target Outcome: Screen-Free Physical Play</text>
    <text x="20" y="44" font-size="9" fill="#2D312E">Caregiver receives step-by-step guidance, puts the mobile device aside, and engages toddler in direct physical play.</text>
    <text x="20" y="58" font-size="8.5" fill="#5A655F">Supports WHO and Philippine ECCD pediatric guidelines: active caregiver-child interaction with zero passive toddler screen time.</text>
  </g>

  <!-- Downward connector from Mobile Client to Outcome -->
  <line x1="267" y1="212" x2="267" y2="238" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="263,234 267,242 271,234" fill="#1F634D"/>
</svg>