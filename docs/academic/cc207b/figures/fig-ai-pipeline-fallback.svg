  <text x="846" y="182" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Picks matching catalog ideas</text>
  <text x="846" y="212" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Adapts safe household items</text>
  <text x="846" y="242" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Adjusts time or difficulty</text>
  <text x="846" y="274" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" fill="#5A6A64">Short timeouts &amp; structured JSON</text>

  <!-- Fallback Vertical Connector -->
  <line x1="994" y1="298" x2="994.0" y2="350.0" stroke="#C25525" stroke-width="2.2" stroke-dasharray="5 4"/>
  <polygon points="994.0,356.0 989.5,347.0 998.5,347.0" fill="#C25525"/>
  <rect x="892" y="314" width="204" height="26" rx="6" fill="#FDF3EE" stroke="#C25525" stroke-width="1.2"/>
  <text x="994" y="331" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#C25525" text-anchor="middle">If Offline, Slow, or Unsafe</text>

  <!-- Fallback Return Arrows -->
  <line x1="740" y1="418" x2="818.0" y2="418.0" stroke="#C25525" stroke-width="2.2" stroke-dasharray="5 4"/>
  <polygon points="824.0,418.0 815.0,422.5 815.0,413.5" fill="#C25525"/>
  <text x="784" y="406" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#C25525" text-anchor="middle">2b. Backup</text>

  <line x1="828" y1="478" x2="750.0" y2="478.0" stroke="#1F634D" stroke-width="2.4"/>
  <polygon points="744.0,478.0 753.0,473.5 753.0,482.5" fill="#1F634D"/>
  <text x="784" y="466" font-family="Arial, Liberation Sans, sans-serif" font-size="12.5" font-weight="700" fill="#1F634D" text-anchor="middle">3b. Safe Pick</text>

  <!-- Right Bottom: Catalog Fallback -->
  <rect x="828" y="360" width="332" height="170" rx="10" fill="#FAFBF9" stroke="#1F634D" stroke-width="2"/>
  <path d="M 838 360 H 1150 Q 1160 360 1160 370 V 402 H 828 V 370 Q 828 360 838 360 Z" fill="#1F634D"/>
  <text x="994" y="387" font-family="Arial, Liberation Sans, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reviewed Activity Catalog</text>
  <text x="846" y="432" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Reliable backup recommendations</text>
  <text x="846" y="460" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Matched by age &amp; play space</text>
  <text x="846" y="488" font-family="Arial, Liberation Sans, sans-serif" font-size="13.5" fill="#1A2B29">• Clear non-AI attribution label</text>

  <!-- Footer Note -->
  <text x="40" y="566" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#5A6A64">Note: Single-activity tweaks use quick rule-based adjustments if Gemini is unavailable; hourly usage limits return a calm cooldown message.</text>
</svg>
