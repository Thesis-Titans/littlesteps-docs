<svg xmlns="http://www.w3.org/2000/svg" width="800" height="495" viewBox="0 0 800 495" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
  <defs>
    <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="495" fill="#FFFFFF" rx="6" stroke="#D1DCD1" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="30" font-size="14.5" font-weight="700" fill="#1F634D">Figure 2.8: AI Selection Pipeline and Fallback Architecture</text>
  <text x="28" y="46" font-size="11" fill="#5A655F">Catalog-grounded recommendation workflow with deterministic 3-tier fallback and pediatric safety filters</text>
  <line x1="28" y1="56" x2="772" y2="56" stroke="#E2E8E2" stroke-width="1"/>

  <!-- Layer 1: Client Layer (Flutter Mobile App) -->
  <g transform="translate(28, 72)">
    <rect width="206" height="355" rx="5" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow)"/>
    <rect width="206" height="32" rx="5" fill="#1F634D"/>
    <rect y="26" width="206" height="6" fill="#1F634D"/>
    <text x="103" y="21" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mobile Client (Flutter)</text>
    <text x="103" y="48" font-size="9" font-weight="600" fill="#5A655F" text-anchor="middle">In-situ IdeaHelperCard (Explore tab)</text>

    <!-- Inputs Box -->
    <rect x="12" y="60" width="182" height="116" rx="4" fill="#F7F7ED" stroke="#D1DCD1" stroke-width="1"/>
    <text x="18" y="77" font-size="9.5" font-weight="700" fill="#2D312E">Caregiver Inputs:</text>
    <text x="20" y="94" font-size="8.5" fill="#5A655F">• Age Band: &quot;12-23m&quot; (derived)</text>
    <text x="20" y="109" font-size="8.5" fill="#5A655F">• Setting: &quot;indoor&quot; | &quot;outdoor&quot;</text>
    <text x="20" y="124" font-size="8.5" fill="#5A655F">• Duration: 10–60 minutes</text>
    <text x="20" y="139" font-size="8.5" fill="#5A655F">• Materials: Household items</text>
    <text x="20" y="156" font-size="8" font-style="italic" fill="#C85A32">*No child names, gender, or PII</text>

    <!-- UI Response Rendering -->
    <rect x="12" y="188" width="182" height="148" rx="4" fill="#F4F2E8" stroke="#D1DCD1" stroke-width="1"/>
    <text x="18" y="206" font-size="9.5" font-weight="700" fill="#2D312E">Provenance Display:</text>
    
    <rect x="18" y="216" width="105" height="18" rx="3" fill="#3B7EA1"/>
    <text x="70" y="229" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Suggested by AI</text>
    <text x="20" y="247" font-size="8" fill="#5A655F">Tier 1: Cloud Gemini pick</text>

    <rect x="18" y="262" width="70" height="18" rx="3" fill="#1F634D"/>
    <text x="53" y="275" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Our picks</text>
    <text x="20" y="293" font-size="8" fill="#5A655F">Tier 3: Reviewed curriculum</text>

    <text x="18" y="318" font-size="8" font-style="italic" fill="#5A655F">&quot;Observational play only...&quot;</text>
  </g>

  <!-- Connectors: Client <-> Gateway -->
  <!-- 1. Outbound Request -->
  <line x1="234" y1="140" x2="274" y2="140" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="268,136 276,140 268,144" fill="#1F634D"/>
  <text x="255" y="132" font-size="8" font-weight="700" fill="#1F634D" text-anchor="middle">1. Request</text>
  <text x="255" y="152" font-size="7" fill="#5A655F" text-anchor="middle">Bearer Auth</text>

  <!-- 4. Inbound Response -->
  <line x1="276" y1="265" x2="238" y2="265" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="244,261 236,265 244,269" fill="#1F634D"/>
  <text x="255" y="257" font-size="8" font-weight="700" fill="#1F634D" text-anchor="middle">4. Response</text>
  <text x="255" y="277" font-size="7" fill="#5A655F" text-anchor="middle">Payload</text>

  <!-- Layer 2: API Gateway Proxy -->
  <g transform="translate(276, 72)">
    <rect width="180" height="355" rx="5" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow)"/>
    <rect width="180" height="32" rx="5" fill="#1F634D"/>
    <rect y="26" width="180" height="6" fill="#1F634D"/>
    <text x="90" y="21" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Backend Proxy API</text>
    <text x="90" y="48" font-size="9" font-weight="600" fill="#5A655F" text-anchor="middle">Node.js / Express (littlesteps-api)</text>

    <!-- Guardrails Box -->
    <rect x="10" y="60" width="160" height="122" rx="4" fill="#F9FAFB" stroke="#E2E8E2" stroke-width="1"/>
    <text x="16" y="77" font-size="9.5" font-weight="700" fill="#2D312E">Security &amp; Rate Controls:</text>
    <text x="16" y="93" font-size="8.5" fill="#5A655F">• Sliding Rate Limiter</text>
    <text x="24" y="106" font-size="7.5" fill="#71717A">(10 req/hr user, 30 req/hr IP)</text>
    <text x="16" y="122" font-size="8.5" fill="#5A655F">• Zod Schema Input Sanitizer</text>
    <text x="16" y="138" font-size="8.5" fill="#5A655F">• Request ID Correlation</text>
    <text x="16" y="154" font-size="8.5" fill="#5A655F">• Private GEMINI_API_KEY</text>
    <text x="24" y="168" font-size="7.5" fill="#71717A">(Exclusively in server config)</text>

    <!-- Dispatch Decision Box -->
    <rect x="10" y="194" width="160" height="130" rx="4" fill="#F4F2E8" stroke="#D1DCD1" stroke-width="1"/>
    <text x="16" y="212" font-size="9.5" font-weight="700" fill="#2D312E">Grounding &amp; Filter Engine:</text>
    <text x="16" y="228" font-size="8.5" fill="#5A655F">1. Query approved ECCD pool</text>
    <text x="16" y="244" font-size="8.5" fill="#5A655F">2. Filter by Age &amp; Setting</text>
    <text x="16" y="260" font-size="8.5" fill="#5A655F">3. Ground prompt with candidates</text>
    <text x="16" y="276" font-size="8.5" fill="#5A655F">4. Verify non-diagnostic</text>
    <text x="24" y="290" font-size="8" fill="#C85A32">denylist terms</text>
    <text x="16" y="306" font-size="8.5" font-weight="600" fill="#1F634D">5. Assemble Provenance</text>
  </g>

  <!-- Connectors: Gateway <-> Tier 1 (gap: 456 to 520 = 64px) -->
  <!-- 2a. Call to Gemini -->
  <line x1="456" y1="120" x2="516" y2="120" stroke="#3B7EA1" stroke-width="1.8"/>
  <polygon points="510,116 518,120 510,124" fill="#3B7EA1"/>
  <text x="488" y="113" font-size="8" font-weight="700" fill="#3B7EA1" text-anchor="middle">2a. Call</text>

  <!-- 3a. Return from Gemini -->
  <line x1="520" y1="160" x2="460" y2="160" stroke="#3B7EA1" stroke-width="1.8"/>
  <polygon points="466,156 458,160 466,164" fill="#3B7EA1"/>
  <text x="488" y="172" font-size="8" font-weight="700" fill="#3B7EA1" text-anchor="middle">3a. Valid</text>

  <!-- Layer 3: Tier 1 (Cloud Gemini) -->
  <g transform="translate(520, 72)">
    <rect width="252" height="150" rx="5" fill="#FFFFFF" stroke="#3B7EA1" stroke-width="1.2" filter="url(#shadow)"/>
    <rect width="252" height="28" rx="5" fill="#3B7EA1"/>
    <rect y="22" width="252" height="6" fill="#3B7EA1"/>
    <text x="126" y="19" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tier 1: Cloud Gemini Foundation Model</text>

    <text x="14" y="44" font-size="9" font-weight="700" fill="#2D312E">Model: gemini-2.5-flash-lite</text>
    <text x="14" y="58" font-size="8.5" fill="#5A655F">• SDK: @google/genai (Node.js runtime)</text>
    <text x="14" y="72" font-size="8.5" fill="#5A655F">• Timeout Guard: 8,000ms AbortController</text>
    <text x="14" y="86" font-size="8.5" fill="#5A655F">• Circuit Breaker: 60s cooldown after 3 fails</text>
    <text x="14" y="104" font-size="9" font-weight="700" fill="#2D312E">Post-Processing Output Validation:</text>
    <text x="14" y="118" font-size="8.5" fill="#5A655F">• Zod schema verification ({ picks })</text>
    <text x="14" y="132" font-size="8.5" fill="#5A655F">• 27-term pediatric non-diagnostic denylist</text>
  </g>

  <!-- Connector: Tier 1 failure drops to Tier 3 -->
  <line x1="646" y1="222" x2="646" y2="260" stroke="#C85A32" stroke-width="1.8" stroke-dasharray="3 3"/>
  <polygon points="642,256 646,264 650,256" fill="#C85A32"/>
  <rect x="578" y="233" width="136" height="16" rx="2" fill="#FDF3EE" stroke="#E8B4A2" stroke-width="0.8"/>
  <text x="646" y="244" font-size="7.5" font-weight="600" fill="#C85A32" text-anchor="middle">Timeout / Schema / Safety Fail</text>

  <!-- Connectors: Gateway <-> Tier 3 (gap: 456 to 520 = 64px) -->
  <!-- 2b. Direct Fallback Trigger -->
  <line x1="456" y1="325" x2="516" y2="325" stroke="#C85A32" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="510,321 518,325 510,329" fill="#C85A32"/>
  <text x="488" y="318" font-size="8" font-weight="700" fill="#C85A32" text-anchor="middle">2b. Fallback</text>

  <!-- 3b. Catalog Return -->
  <line x1="520" y1="365" x2="460" y2="365" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="466,361 458,365 466,369" fill="#1F634D"/>
  <text x="488" y="377" font-size="8" font-weight="700" fill="#1F634D" text-anchor="middle">3b. ECCD</text>

  <!-- Layer 4: Tier 3 (Deterministic Catalog Fallback) -->
  <g transform="translate(520, 268)">
    <rect width="252" height="154" rx="5" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow)"/>
    <rect width="252" height="28" rx="5" fill="#1F634D"/>
    <rect y="22" width="252" height="6" fill="#1F634D"/>
    <text x="126" y="19" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tier 3: Deterministic ECCD Catalog Fallback</text>

    <text x="14" y="44" font-size="9" font-weight="700" fill="#2D312E">Catalog Pool: Philippine ECCD Benchmarks</text>
    <text x="14" y="58" font-size="8.5" fill="#5A655F">• Pre-reviewed early learning curriculum</text>
    <text x="14" y="72" font-size="8.5" fill="#5A655F">• Instant local execution (&lt;5ms, zero network)</text>
    <text x="14" y="86" font-size="8.5" fill="#5A655F">• Age band and material keyword ranking</text>
    <text x="14" y="104" font-size="9" font-weight="700" fill="#2D312E">Reliability &amp; Safety Guarantee:</text>
    <text x="14" y="118" font-size="8.5" fill="#5A655F">• Guaranteed response on cloud/network failure</text>
    <text x="14" y="132" font-size="8.5" fill="#5A655F">• Labeled &quot;Our picks&quot; with non-diagnostic disclaimer</text>
  </g>

  <!-- Footer Note (2 lines to avoid right-edge overflow) -->
  <text x="28" y="456" font-size="9" fill="#71717A">Note: Tier 2 deterministic rule-based adjustment is reserved for single-activity adaptation (/api/v1/ai/adapt-activity).</text>
  <text x="28" y="470" font-size="9" fill="#71717A">Rate limit exhaustion returns an HTTP 429 status with a retry-after waiting notice rather than a silent fallback.</text>
</svg>