  <rect width="1200" height="600" fill="#FFFFFF"/>
  <rect x="6" y="6" width="1188" height="588" rx="14" fill="#FFFFFF" stroke="#D4DCD8" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="44" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="700" fill="#1F634D">AI Selection, Safety Checks &amp; Fallback Flow</text>
  <text x="40" y="68" font-family="Arial, Liberation Sans, sans-serif" font-size="14" fill="#5A6A64">Matching household items with Google Gemini under strict safety checks and automatic fallback</text>
  <line x1="40" y1="84" x2="1160" y2="84" stroke="#E0E5DB" stroke-width="1.2"/>

  <!-- Column 1: Mobile App -->
