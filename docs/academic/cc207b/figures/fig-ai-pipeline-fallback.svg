  <rect x="828" y="108" width="332" height="190" rx="10" fill="#FAFBF9" stroke="#2B6CB0" stroke-width="2"/>
  <path d="M 838 108 H 1150 Q 1160 108 1160 118 V 150 H 828 V 118 Q 828 108 838 108 Z" fill="#2B6CB0"/>
