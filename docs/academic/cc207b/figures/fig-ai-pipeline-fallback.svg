<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
  <defs>
    <filter id="shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#FFFFFF" rx="6" stroke="#D1DCD1" stroke-width="1"/>

  <!-- Header -->
  <text x="25" y="30" font-size="14.5" font-weight="700" fill="#1F634D">Figure 2.8: AI Selection Pipeline and Fallback Architecture</text>
  <text x="25" y="46" font-size="11" fill="#5A655F">Catalog-grounded recommendation workflow with deterministic 3-tier fallback and pediatric safety filters</text>
  <line x1="25" y1="56" x2="775" y2="56" stroke="#E2E8E2" stroke-width="1"/>

  <!-- Layer 1: Client Layer (Flutter Mobile App) -->
  <g transform="translate(25, 72)">
    <rect width="200" height="350" rx="5" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow)"/>
    <rect width="200" height="32" rx="5" fill="#1F634D"/>
    <rect y="26" width="200" height="6" fill="#1F634D"/>
    <text x="100" y="21" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mobile Client (Flutter)</text>
    <text x="100" y="48" font-size="8.5" font-weight="600" fill="#5A655F" text-anchor="middle">In-situ IdeaHelperCard (Explore tab)</text>

    <!-- Inputs Box -->
    <rect x="10" y="58" width="180" height="122" rx="4" fill="#F7F7ED" stroke="#D1DCD1" stroke-width="1"/>
    <text x="16" y="75" font-size="9.5" font-weight="700" fill="#2D312E">Caregiver Inputs:</text>
    <text x="18" y="92" font-size="8.2" fill="#5A655F">• Age Band: &quot;12-23m&quot; (derived)</text>
    <text x="18" y="107" font-size="8.2" fill="#5A655F">• Setting: &quot;indoor&quot; | &quot;outdoor&quot;</text>
    <text x="18" y="122" font-size="8.2" fill="#5A655F">• Duration: 10–60 minutes</text>
    <text x="18" y="137" font-size="8.2" fill="#5A655F">• Materials: Household items</text>
    <text x="18" y="154" font-size="7.8" font-style="italic" fill="#C85A32">*No child names, gender, or PII</text>
    <text x="18" y="168" font-size="7.2" fill="#71717A">Encrypted payload in transit</text>

    <!-- UI Response Rendering -->
    <rect x="10" y="190" width="180" height="148" rx="4" fill="#F4F2E8" stroke="#D1DCD1" stroke-width="1"/>
    <text x="16" y="208" font-size="9.5" font-weight="700" fill="#2D312E">Provenance Display:</text>
    
    <rect x="16" y="218" width="105" height="18" rx="3" fill="#3B7EA1"/>
    <text x="68" y="231" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Suggested by AI</text>
    <text x="18" y="249" font-size="8" fill="#5A655F">Tier 1: Cloud Gemini pick</text>

    <rect x="16" y="264" width="70" height="18" rx="3" fill="#1F634D"/>
    <text x="51" y="277" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Our picks</text>
    <text x="18" y="295" font-size="8" fill="#5A655F">Tier 3: Reviewed curriculum</text>

    <text x="16" y="322" font-size="7.8" font-style="italic" fill="#5A655F">&quot;Observational play only...&quot;</text>
  </g>

  <!-- Connectors: Client <-> Gateway (Gap: 225 to 281 = 56px, Center = 253) -->
  <!-- 1. Outbound Request -->
  <line x1="225" y1="130" x2="273" y2="130" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="269,126 279,130 269,134" fill="#1F634D"/>
  <text x="253" y="122" font-size="8" font-weight="700" fill="#1F634D" text-anchor="middle">1. Request</text>
  <text x="253" y="142" font-size="7" fill="#5A655F" text-anchor="middle">Bearer Auth</text>

  <!-- 4. Inbound Response -->
  <line x1="281" y1="260" x2="233" y2="260" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="237,256 227,260 237,264" fill="#1F634D"/>
  <text x="253" y="252" font-size="8" font-weight="700" fill="#1F634D" text-anchor="middle">4. Response</text>
  <text x="253" y="272" font-size="7" fill="#5A655F" text-anchor="middle">Payload</text>

  <!-- Layer 2: API Gateway Proxy -->
  <g transform="translate(281, 72)">
    <rect width="194" height="350" rx="5" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow)"/>
    <rect width="194" height="32" rx="5" fill="#1F634D"/>
    <rect y="26" width="194" height="6" fill="#1F634D"/>
    <text x="97" y="21" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Backend Proxy API</text>
    <text x="97" y="48" font-size="8.5" font-weight="600" fill="#5A655F" text-anchor="middle">Node.js / Express (littlesteps-api)</text>

    <!-- Guardrails Box -->
    <rect x="10" y="58" width="174" height="122" rx="4" fill="#F9FAFB" stroke="#E2E8E2" stroke-width="1"/>
    <text x="16" y="75" font-size="9.5" font-weight="700" fill="#2D312E">Security &amp; Rate Controls:</text>
    <text x="16" y="91" font-size="8.2" fill="#5A655F">• Sliding Rate Limiter</text>
    <text x="22" y="104" font-size="7.5" fill="#71717A">(10 req/hr user, 30 req/hr IP)</text>
    <text x="16" y="119" font-size="8.2" fill="#5A655F">• Zod Schema Input Sanitizer</text>
    <text x="16" y="134" font-size="8.2" fill="#5A655F">• Request ID Correlation</text>
    <text x="16" y="149" font-size="8.2" fill="#5A655F">• Private GEMINI_API_KEY</text>
    <text x="22" y="163" font-size="7.5" fill="#71717A">(Server config exclusively)</text>

    <!-- Dispatch Decision Box -->
    <rect x="10" y="190" width="174" height="148" rx="4" fill="#F4F2E8" stroke="#D1DCD1" stroke-width="1"/>
    <text x="16" y="208" font-size="9.5" font-weight="700" fill="#2D312E">Grounding &amp; Filter Engine:</text>
    <text x="16" y="225" font-size="8.2" fill="#5A655F">1. Query approved ECCD pool</text>
    <text x="16" y="240" font-size="8.2" fill="#5A655F">2. Filter by Age &amp; Setting</text>
    <text x="16" y="255" font-size="8.2" fill="#5A655F">3. Ground prompt with candidates</text>
    <text x="16" y="270" font-size="8.2" fill="#5A655F">4. Verify non-diagnostic terms</text>
    <text x="22" y="284" font-size="7.8" fill="#C85A32">denylist string inspection</text>
    <text x="16" y="301" font-size="8.2" font-weight="600" fill="#1F634D">5. Assemble Provenance</text>
    <text x="22" y="315" font-size="7.5" fill="#71717A">Attach source tier metadata</text>
  </g>

  <!-- Connectors: Gateway <-> Tiers (Gap: 475 to 531 = 56px, Center = 503) -->
  <!-- 2a. Call to Gemini -->
  <line x1="475" y1="120" x2="523" y2="120" stroke="#3B7EA1" stroke-width="1.8"/>
  <polygon points="519,116 529,120 519,124" fill="#3B7EA1"/>
  <text x="503" y="113" font-size="8" font-weight="700" fill="#3B7EA1" text-anchor="middle">2a. Call</text>

  <!-- 3a. Return from Gemini -->
  <line x1="531" y1="160" x2="483" y2="160" stroke="#3B7EA1" stroke-width="1.8"/>
  <polygon points="487,156 477,160 487,164" fill="#3B7EA1"/>
  <text x="503" y="172" font-size="8" font-weight="700" fill="#3B7EA1" text-anchor="middle">3a. Valid</text>

  <!-- Layer 3: Tier 1 (Cloud Gemini) -->
  <g transform="translate(531, 72)">
    <rect width="244" height="148" rx="5" fill="#FFFFFF" stroke="#3B7EA1" stroke-width="1.2" filter="url(#shadow)"/>
    <rect width="244" height="28" rx="5" fill="#3B7EA1"/>
    <rect y="22" width="244" height="6" fill="#3B7EA1"/>
    <text x="122" y="19" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tier 1: Cloud Gemini Foundation Model</text>

    <text x="12" y="44" font-size="8.8" font-weight="700" fill="#2D312E">Model: gemini-2.5-flash-lite</text>
    <text x="12" y="58" font-size="8.2" fill="#5A655F">• SDK: @google/genai (Node.js runtime)</text>
    <text x="12" y="72" font-size="8.2" fill="#5A655F">• Timeout Guard: 8,000ms AbortController</text>
    <text x="12" y="86" font-size="8.2" fill="#5A655F">• Circuit Breaker: 60s cooldown after 3 fails</text>
    <text x="12" y="103" font-size="8.8" font-weight="700" fill="#2D312E">Post-Processing Output Validation:</text>
    <text x="12" y="117" font-size="8.2" fill="#5A655F">• Zod schema verification ({ picks })</text>
    <text x="12" y="131" font-size="8.2" fill="#5A655F">• 27-term pediatric non-diagnostic denylist</text>
  </g>

  <!-- Connector: Tier 1 failure drops to Tier 3 (Centered at X=653) -->
  <line x1="653" y1="220" x2="653" y2="264" stroke="#C85A32" stroke-width="1.8" stroke-dasharray="3 3"/>
  <polygon points="649,260 653,268 657,260" fill="#C85A32"/>
  <rect x="585" y="234" width="136" height="16" rx="2" fill="#FDF3EE" stroke="#E8B4A2" stroke-width="0.8"/>
  <text x="653" y="245" font-size="7.5" font-weight="600" fill="#C85A32" text-anchor="middle">Timeout / Schema / Safety Fail</text>

  <!-- Connectors: Gateway <-> Tier 3 (Gap: 475 to 531 = 56px, Center = 503) -->
  <!-- 2b. Direct Fallback Trigger -->
  <line x1="475" y1="325" x2="523" y2="325" stroke="#C85A32" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="519,321 529,325 519,329" fill="#C85A32"/>
  <text x="503" y="318" font-size="8" font-weight="700" fill="#C85A32" text-anchor="middle">2b. Fallback</text>

  <!-- 3b. Catalog Return -->
  <line x1="531" y1="365" x2="483" y2="365" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="487,361 477,365 487,369" fill="#1F634D"/>
  <text x="503" y="377" font-size="8" font-weight="700" fill="#1F634D" text-anchor="middle">3b. ECCD</text>

  <!-- Layer 4: Tier 3 (Deterministic Catalog Fallback) -->
  <g transform="translate(531, 268)">
    <rect width="244" height="154" rx="5" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.2" filter="url(#shadow)"/>
    <rect width="244" height="28" rx="5" fill="#1F634D"/>
    <rect y="22" width="244" height="6" fill="#1F634D"/>
    <text x="122" y="19" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tier 3: Deterministic ECCD Catalog Fallback</text>

    <text x="12" y="44" font-size="8.8" font-weight="700" fill="#2D312E">Catalog Pool: Philippine ECCD Benchmarks</text>
    <text x="12" y="58" font-size="8.2" fill="#5A655F">• Pre-reviewed early learning curriculum</text>
    <text x="12" y="72" font-size="8.2" fill="#5A655F">• Instant local execution (&lt;5ms, zero network)</text>
    <text x="12" y="86" font-size="8.2" fill="#5A655F">• Age band and material keyword ranking</text>
    <text x="12" y="103" font-size="8.8" font-weight="700" fill="#2D312E">Reliability &amp; Safety Guarantee:</text>
    <text x="12" y="117" font-size="8.2" fill="#5A655F">• Guaranteed response on cloud/network failure</text>
    <text x="12" y="131" font-size="8.2" fill="#5A655F">• Labeled &quot;Our picks&quot; with non-diagnostic disclaimer</text>
  </g>

  <!-- Footer Note (2 clean lines) -->
  <text x="25" y="448" font-size="8.5" fill="#71717A">Note: Tier 2 deterministic rule-based adjustment is reserved for single-activity adaptation (/api/v1/ai/adapt-activity).</text>
  <text x="25" y="462" font-size="8.5" fill="#71717A">Rate limit exhaustion returns an HTTP 429 status with a retry-after waiting notice rather than a silent fallback.</text>
</svg>
