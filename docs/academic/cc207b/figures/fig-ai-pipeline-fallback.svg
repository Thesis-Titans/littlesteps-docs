  <rect x="58" y="334" width="260" height="178" rx="8" fill="#F4F2E8" stroke="#D8D6C8" stroke-width="1.2"/>
  <text x="74" y="360" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" fill="#1A2B29">Clear Result Labels</text>
  <rect x="74" y="374" width="136" height="24" rx="5" fill="#2B6CB0"/>
  <text x="142" y="391" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Suggested by AI</text>
  <text x="74" y="414" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#5A6A64">Matched from reviewed catalog</text>

  <rect x="74" y="426" width="154" height="24" rx="5" fill="#FAE8A8"/>
  <text x="151" y="443" font-family="Arial, Liberation Sans, sans-serif" font-size="12" font-weight="700" fill="#5C4008" text-anchor="middle">Material adaptation</text>
  <text x="74" y="466" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#5A6A64">Safe household-item play idea</text>

