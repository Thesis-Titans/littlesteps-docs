  <text x="454" y="220" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#1A2B29">• Verifies caregiver sign-in</text>
  <text x="454" y="244" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#1A2B29">• Enforces hourly usage limits</text>
  <text x="454" y="268" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#1A2B29">• Rejects unsafe items upfront</text>
  <text x="454" y="292" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#1A2B29">• Keeps Gemini key on server</text>

  <rect x="438" y="324" width="284" height="188" rx="8" fill="#F0F5F2" stroke="#D4DCD8" stroke-width="1.2"/>
  <text x="454" y="350" font-family="Arial, Liberation Sans, sans-serif" font-size="14" font-weight="700" fill="#1A2B29">Three-Stage Safety Check</text>
  <text x="454" y="378" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#1A2B29">1. Screen household item inputs</text>
  <text x="454" y="406" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#1A2B29">2. Check item safety before play</text>
  <text x="454" y="434" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#1A2B29">3. Block hazards &amp; clinical terms</text>
  <text x="454" y="470" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#1F634D">Switches to catalog fallback</text>
  <text x="454" y="490" font-family="Arial, Liberation Sans, sans-serif" font-size="13" font-weight="700" fill="#1F634D">whenever any check fails</text>

  <!-- Connectors 2 <-> 3 -->
  <line x1="740" y1="194" x2="818.0" y2="194.0" stroke="#2B6CB0" stroke-width="2.4"/>
  <polygon points="824.0,194.0 815.0,198.5 815.0,189.5" fill="#2B6CB0"/>
