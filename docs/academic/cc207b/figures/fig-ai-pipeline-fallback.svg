<svg xmlns="http://www.w3.org/2000/svg" width="800" height="495" viewBox="0 0 800 495" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="495" fill="#FDFDFB" rx="8" stroke="#E2E8E2" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="34" font-size="16" font-weight="700" fill="#1F634D">Figure 2.8: LittleSteps AI Fallback Architecture &amp; Safety Pipeline</text>
  <text x="32" y="52" font-size="11.5" fill="#5A655F">Catalog-grounded generative selection with deterministic 3-tier fallback and pediatric boundary enforcement</text>
  <line x1="32" y1="64" x2="768" y2="64" stroke="#E2E8E2" stroke-width="1.2"/>

  <!-- Layer 1: Client Layer (Flutter Mobile App) -->
  <g transform="translate(32, 80)">
    <rect width="202" height="345" rx="6" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="202" height="36" rx="6" fill="#1F634D"/>
    <rect y="30" width="202" height="6" fill="#1F634D"/>
    <text x="101" y="23" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">LittleSteps Flutter Client</text>
    <text x="101" y="52" font-size="9.5" font-weight="600" fill="#5A655F" text-anchor="middle">In-situ IdeaHelperCard (Explore)</text>

    <!-- Inputs Box -->
    <rect x="12" y="65" width="178" height="112" rx="4" fill="#F7F7ED" stroke="#D1DCD1" stroke-width="1"/>
    <text x="18" y="82" font-size="10" font-weight="700" fill="#2D312E">Caregiver Bounded Inputs:</text>
    <text x="20" y="100" font-size="9" fill="#5A655F">• Age Band: &quot;12-23m&quot; (derived)</text>
    <text x="20" y="116" font-size="9" fill="#5A655F">• Setting: &quot;indoor&quot; | &quot;outdoor&quot;</text>
    <text x="20" y="132" font-size="9" fill="#5A655F">• Duration: 10–60 minutes</text>
    <text x="20" y="148" font-size="9" fill="#5A655F">• Materials: Free text (&#8804;100 ch)</text>
    <text x="20" y="165" font-size="8.5" font-style="italic" fill="#C85A32">*No child names, gender, or PII</text>

    <!-- UI Response Rendering -->
    <rect x="12" y="190" width="178" height="142" rx="4" fill="#F4F2E8" stroke="#D1DCD1" stroke-width="1"/>
    <text x="18" y="208" font-size="10" font-weight="700" fill="#2D312E">UI Provenance Display:</text>
    
    <rect x="18" y="218" width="105" height="18" rx="3" fill="#3B7EA1"/>
    <text x="70" y="231" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Suggested by AI</text>
    <text x="20" y="250" font-size="8.5" fill="#5A655F">Tier 1: Cloud Gemini pick</text>

    <rect x="18" y="264" width="70" height="18" rx="3" fill="#1F634D"/>
    <text x="53" y="277" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Our picks</text>
    <text x="20" y="296" font-size="8.5" fill="#5A655F">Tier 3: Reviewed curriculum</text>

    <text x="18" y="320" font-size="8.5" font-style="italic" fill="#5A655F">&quot;Observational play only...&quot;</text>
  </g>

  <!-- Connectors: Client <-> Gateway -->
  <!-- 1. Outbound Request -->
  <line x1="234" y1="145" x2="274" y2="145" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="268,141 276,145 268,149" fill="#1F634D"/>
  <text x="255" y="137" font-size="8" font-weight="700" fill="#1F634D" text-anchor="middle">1. Request</text>
  <text x="255" y="157" font-size="7" fill="#5A655F" text-anchor="middle">Bearer Auth</text>

  <!-- 4. Inbound Response -->
  <line x1="276" y1="260" x2="238" y2="260" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="244,256 236,260 244,264" fill="#1F634D"/>
  <text x="255" y="252" font-size="8" font-weight="700" fill="#1F634D" text-anchor="middle">4. Result</text>
  <text x="255" y="272" font-size="7" fill="#5A655F" text-anchor="middle">Payload</text>

  <!-- Layer 2: API Gateway Proxy -->
  <g transform="translate(276, 80)">
    <rect width="180" height="345" rx="6" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="180" height="36" rx="6" fill="#1F634D"/>
    <rect y="30" width="180" height="6" fill="#1F634D"/>
    <text x="90" y="23" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">littlesteps-api Gateway</text>
    <text x="90" y="52" font-size="9.5" font-weight="600" fill="#5A655F" text-anchor="middle">Zero-Credential Server Proxy</text>

    <!-- Guardrails Box -->
    <rect x="10" y="65" width="160" height="120" rx="4" fill="#F9FAFB" stroke="#E2E8E2" stroke-width="1"/>
    <text x="16" y="82" font-size="9.5" font-weight="700" fill="#2D312E">Security &amp; Rate Guards:</text>
    <text x="16" y="98" font-size="8.5" fill="#5A655F">• Sliding Rate Limiter</text>
    <text x="24" y="112" font-size="8" fill="#71717A">(10 req/hr user, 30 req/hr IP)</text>
    <text x="16" y="128" font-size="8.5" fill="#5A655F">• Zod Schema Input Sanitizer</text>
    <text x="16" y="144" font-size="8.5" fill="#5A655F">• Request ID Correlation</text>
    <text x="16" y="160" font-size="8.5" fill="#5A655F">• Private GEMINI_API_KEY</text>
    <text x="24" y="174" font-size="8" fill="#71717A">(Never exposed to mobile)</text>

    <!-- Dispatch Decision Box -->
    <rect x="10" y="196" width="160" height="125" rx="4" fill="#F4F2E8" stroke="#D1DCD1" stroke-width="1"/>
    <text x="16" y="214" font-size="9.5" font-weight="700" fill="#2D312E">Selection Pipeline:</text>
    <text x="16" y="230" font-size="8.5" fill="#5A655F">1. Fetch reviewed ECCD pool</text>
    <text x="16" y="246" font-size="8.5" fill="#5A655F">2. Pre-filter by Age &amp; Setting</text>
    <text x="16" y="262" font-size="8.5" fill="#5A655F">3. Inject candidates in prompt</text>
    <text x="16" y="278" font-size="8.5" fill="#5A655F">4. Enforce Non-Diagnostic</text>
    <text x="24" y="292" font-size="8" fill="#C85A32">denylist verification</text>
    <text x="16" y="308" font-size="8" font-weight="600" fill="#1F634D">5. Assemble Provenance</text>
  </g>

  <!-- Connectors: Gateway <-> Tier 1 (gap: 456 to 520 = 64px) -->
  <!-- 2a. Call to Gemini -->
  <line x1="456" y1="125" x2="516" y2="125" stroke="#3B7EA1" stroke-width="1.8"/>
  <polygon points="510,121 518,125 510,129" fill="#3B7EA1"/>
  <text x="488" y="118" font-size="8" font-weight="700" fill="#3B7EA1" text-anchor="middle">2a. Call</text>

  <!-- 3a. Return from Gemini -->
  <line x1="520" y1="165" x2="460" y2="165" stroke="#3B7EA1" stroke-width="1.8"/>
  <polygon points="466,161 458,165 466,169" fill="#3B7EA1"/>
  <text x="488" y="177" font-size="8" font-weight="700" fill="#3B7EA1" text-anchor="middle">3a. Valid</text>

  <!-- Layer 3: Tier 1 (Cloud Gemini) -->
  <g transform="translate(520, 80)">
    <rect width="248" height="148" rx="6" fill="#FFFFFF" stroke="#3B7EA1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="248" height="28" rx="6" fill="#3B7EA1"/>
    <rect y="22" width="248" height="6" fill="#3B7EA1"/>
    <text x="124" y="19" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tier 1: Cloud Gemini 2.5 Flash Lite</text>

    <text x="14" y="44" font-size="9.5" font-weight="700" fill="#2D312E">Foundation Model Execution:</text>
    <text x="14" y="58" font-size="9" fill="#5A655F">• SDK: @google/genai (v0.1.1)</text>
    <text x="14" y="72" font-size="9" fill="#5A655F">• Timeout Guard: 8,000ms AbortController</text>
    <text x="14" y="86" font-size="9" fill="#5A655F">• Circuit Breaker: 60s cooldown after 3 fails</text>
    <text x="14" y="102" font-size="9.5" font-weight="700" fill="#2D312E">Post-Processing Validation:</text>
    <text x="14" y="116" font-size="9" fill="#5A655F">• Output Zod schema check (ReplySchema)</text>
    <text x="14" y="130" font-size="9" fill="#5A655F">• 27-term Non-Diagnostic Denylist verification</text>
  </g>

  <!-- Connector: Tier 1 failure drops to Tier 3 -->
  <line x1="644" y1="228" x2="644" y2="265" stroke="#C85A32" stroke-width="1.8" stroke-dasharray="3 3"/>
  <polygon points="640,260 644,268 648,260" fill="#C85A32"/>
  <rect x="576" y="238" width="136" height="16" rx="2" fill="#FDF3EE" stroke="#E8B4A2" stroke-width="0.8"/>
  <text x="644" y="250" font-size="8" font-weight="600" fill="#C85A32" text-anchor="middle">Timeout / Schema / Safety Fail</text>

  <!-- Connectors: Gateway <-> Tier 3 (gap: 456 to 520 = 64px) -->
  <!-- 2b. Direct Fallback Trigger -->
  <line x1="456" y1="325" x2="516" y2="325" stroke="#C85A32" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="510,321 518,325 510,329" fill="#C85A32"/>
  <text x="488" y="318" font-size="8" font-weight="700" fill="#C85A32" text-anchor="middle">2b. Fallback</text>

  <!-- 3b. Catalog Return -->
  <line x1="520" y1="365" x2="460" y2="365" stroke="#1F634D" stroke-width="1.8"/>
  <polygon points="466,361 458,365 466,369" fill="#1F634D"/>
  <text x="488" y="377" font-size="8" font-weight="700" fill="#1F634D" text-anchor="middle">3b. ECCD</text>

  <!-- Layer 4: Tier 3 (Deterministic Catalog Fallback) -->
  <g transform="translate(520, 272)">
    <rect width="248" height="152" rx="6" fill="#FFFFFF" stroke="#1F634D" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="248" height="28" rx="6" fill="#1F634D"/>
    <rect y="22" width="248" height="6" fill="#1F634D"/>
    <text x="124" y="19" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tier 3: Deterministic ECCD Catalog</text>

    <text x="14" y="44" font-size="9.5" font-weight="700" fill="#2D312E">Offline Guaranteed Fallback Pool:</text>
    <text x="14" y="58" font-size="9" fill="#5A655F">• Verified Philippine ECCD Council benchmarks</text>
    <text x="14" y="72" font-size="9" fill="#5A655F">• Instant local execution (&lt;5ms, zero network)</text>
    <text x="14" y="86" font-size="9" fill="#5A655F">• Keyword &amp; age-band semantic ranking</text>
    <text x="14" y="102" font-size="9.5" font-weight="700" fill="#2D312E">Caregiver Experience Guarantee:</text>
    <text x="14" y="116" font-size="9" fill="#5A655F">• Zero empty screens, hangs, or alert crashes</text>
    <text x="14" y="130" font-size="9" fill="#5A655F">• Labeled &quot;Our picks&quot; with transparent disclaimer</text>
  </g>

  <!-- Footer Note (2 lines to avoid right-edge overflow) -->
  <text x="32" y="456" font-size="9" fill="#71717A">Architectural Note: Tier 2 rule-based deterministic adaptation is reserved for single-activity adaptation (/api/v1/ai/adapt-activity).</text>
  <text x="32" y="470" font-size="9" fill="#71717A">Rate limiting (429) returns an actionable cooldown notice without silent fallback, preserving cloud provider and database bounds.</text>
</svg>